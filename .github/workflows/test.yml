name: Test backends

on:
  push:
    branches: [master]
  pull_request:
  # NOTE: Sites change on their own, so we also test when nothing changed here.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      level:
        description: Test level
        type: choice
        options: [extract, stream, throttle, measure]
        default: extract
      backend:
        description: Branch of omega-gg/backend to test
        default: master

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # NOTE: test/ci.sh decides if clientVBML needs a new build.
      - uses: actions/cache/restore@v6
        with:
          path: build/ci/bin
          key: client-${{ github.run_id }}
          restore-keys: client-

      - shell: bash
        env:
          LEVEL: ${{ inputs.level || 'extract' }}
          BACKEND: ${{ inputs.backend || 'master' }}
        run: sh test/ci.sh "$LEVEL" "$BACKEND"

      # NOTE: We keep the build even when a test fails.
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: build/ci/bin
          key: client-${{ github.run_id }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results
          path: build/results
